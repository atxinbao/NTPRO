# cargo-audit configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
#
# Mirrors deny.toml [advisories] ignore list, plus three advisories that
# cargo-audit surfaces but cargo-deny does not match against the lockfile:
#   - RUSTSEC-2024-0388 (derivative, unmaintained via alloy-primitives -> ruint -> ark-ff)
#   - RUSTSEC-2023-0071 (rsa Marvin Attack, transitive via sqlx-mysql, no upstream fix)
#   - RUSTSEC-2026-0235 (inactive optional rkyv via rust_decimal)

[advisories]
ignore = [
  # paste unmaintained, transitive via alloy
  "RUSTSEC-2024-0436",
  # derivative unmaintained, transitive via alloy-primitives -> ruint -> ark-ff
  "RUSTSEC-2024-0388",
  # rustls-pemfile unmaintained, transitive via nautilus-network
  "RUSTSEC-2025-0134",
  # unic-* unmaintained, transitive via pyo3-stub-gen -> rustpython-parser (dev tool only)
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0090",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  # bincode unmaintained, transitive via hypersync-client
  "RUSTSEC-2025-0141",
  # capnp unsound APIs, transitive via hypersync-client, awaiting upstream fix
  "RUSTSEC-2025-0143",
  # rsa Marvin Attack, transitive via sqlx-mysql, no fix available
  "RUSTSEC-2023-0071",
  # quick-xml duplicate-attribute and namespace-declaration DoS advisories via object_store cloud features;
  # no compatible DataFusion/object_store upgrade currently resolves quick-xml >=0.41
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # rkyv 0.7.46 is only rust_decimal's disabled optional dependency; no active workspace path.
  # cargo-deny intentionally does not ignore this advisory, so enabling the feature fails closed.
  # Remove when rust_decimal supports rkyv >=0.8.17 or scanners exclude inactive optional deps.
  "RUSTSEC-2026-0235",
]
