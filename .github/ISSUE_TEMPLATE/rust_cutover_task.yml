name: NTPRO Rust cutover task
description: Controlled NTPRO Rust-first cutover task
title: "[Rust Cutover] <task-id>: <title>"
labels: ["rust-cutover", "agent-ready", "backend-freeze"]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Use the canonical task ID from docs/rust-cutover/tasks.
      placeholder: RCTL-006
    validations:
      required: true
  - type: dropdown
    id: owner_role
    attributes:
      label: Owner role
      options:
        - control_scope_agent
        - rust_product_surface_agent
        - rust_core_runtime_agent
        - adapter_integration_agent
        - verification_release_gatekeeper
    validations:
      required: true
  - type: dropdown
    id: review_role
    attributes:
      label: Review role
      options:
        - verification_release_gatekeeper
        - control_scope_agent
        - rust_product_surface_agent
        - rust_core_runtime_agent
        - adapter_integration_agent
    validations:
      required: true
  - type: dropdown
    id: risk_level
    attributes:
      label: Risk level
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: dropdown
    id: backend_freeze_classification
    attributes:
      label: Backend freeze classification
      description: Classify this task against the frozen v0.32.0 backend baseline.
      options:
        - baseline-preserving-governance
        - v33-separately-scoped
        - backend-freeze-exception
    validations:
      required: true
  - type: dropdown
    id: frozen_backend_boundary_touch
    attributes:
      label: Frozen backend boundary touch
      description: Does this task modify a v0.32.0 frozen backend boundary or release fact?
      options:
        - "no"
        - "yes"
    validations:
      required: true
  - type: dropdown
    id: forbidden_capability_request
    attributes:
      label: Forbidden capability request
      description: Select the capability category this task requests. Any value other than none requires a backend-freeze exception.
      options:
        - none
        - submit-or-order-mutation
        - adapter-send-or-live-exchange-request
        - retry-remediation-or-automatic-recovery
        - dashboard-admin-or-trader-terminal-trading-controls
        - actual-backend-go-live-or-production-execution
    validations:
      required: true
  - type: textarea
    id: backend_freeze_analysis
    attributes:
      label: Backend freeze analysis
      description: Explain why the classification is correct and list frozen registry fields or paths touched.
    validations:
      required: true
  - type: textarea
    id: backend_freeze_exception_authorization
    attributes:
      label: Backend freeze exception authorization
      description: Enter Not applicable, or provide the owner authorization, risk, rollback, and audit evidence for an exception.
    validations:
      required: true
  - type: textarea
    id: v33_separate_scope
    attributes:
      label: v0.33+ separate scope
      description: Enter Not applicable, or define owner, module boundary, dependencies, data contract, rollback, telemetry, and non-inheritance proof.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files/directories allowed to change.
    validations:
      required: true
  - type: textarea
    id: prohibited_paths
    attributes:
      label: Prohibited paths
      description: Paths that must not change for this task.
      placeholder: |
        - crates/**
        - python/**
        - nautilus_trader/**
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Task IDs, scope decisions, or gates required before work starts.
      placeholder: |
        - RCTL-005
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Required commands
      placeholder: |
        scripts/ai/verify_fast.sh
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Evidence file, command output, test result, and gate artifacts.
      placeholder: |
        - docs/rust-cutover/evidence/<TASK_ID>.md
        - command result summary
        - behavior impact
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gate confirmations
      options:
        - label: This issue is one task only.
          required: true
        - label: Owner role and review role are different.
          required: true
        - label: BLOCKED is not DONE.
          required: true
        - label: QA_PASSED is not DONE.
          required: true
        - label: Python, PyO3, or Cython removal is not allowed unless a scope decision and release gate explicitly allow it.
          required: true
        - label: The task does not treat v0.32.0 as authorization for backend go-live, submit, mutation, adapter send, live exchange, retry, remediation, recovery, or trading controls.
          required: true
        - label: Any v0.33+ task is separately scoped and inherits no forbidden capability from v0.32.0.
          required: true
        - label: Any backend-freeze exception includes explicit authorization, impact, rollback, and reconstructable audit evidence.
          required: true
