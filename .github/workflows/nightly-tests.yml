name: nightly Rust tests

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [test-nightly]

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        stage:
          - rust-tests-workspace-core
          - rust-tests-workspace-runtime
          - rust-tests-workspace-adapters-a
          - rust-tests-workspace-adapters-b
          - rust-tests-common-log-global
          - rust-tests-live-log-global
          - rust-tests-live-node-serial
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          cache: true
          override: true
      - name: Run nightly Rust stage
        env:
          STAGE: ${{ matrix.stage }}
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
        run: scripts/ai/verify_full.sh "$STAGE"
