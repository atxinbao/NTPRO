name: security-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      workflow_audit_needed: ${{ steps.classify.outputs.security_workflow }}
      dependency_audit_needed: ${{ steps.classify.outputs.security_dependencies }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm Rust-only audit inputs
        run: |
          test -f Cargo.lock
          test -f deny.toml
          test -d .supply-chain
      - name: Classify security audit changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: scripts/ci/security-audit-gate.sh
      - name: CI change classifier self-test
        run: scripts/ci/test-ci-change-classifier.sh

  zizmor:
    needs: changes
    if: needs.changes.outputs.workflow_audit_needed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: zizmor
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --format sarif --min-severity medium --config .zizmor.yml .github/ > zizmor.sarif
      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  cargo-audit:
    needs: changes
    if: needs.changes.outputs.dependency_audit_needed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-audit
      - run: cargo audit

  cargo-deny:
    needs: changes
    if: needs.changes.outputs.dependency_audit_needed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-deny
      - run: cargo deny --all-features check advisories licenses sources bans

  cargo-vet:
    needs: changes
    if: needs.changes.outputs.dependency_audit_needed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-vet
      - run: cargo vet --locked

  osv-scanner:
    needs: changes
    if: needs.changes.outputs.dependency_audit_needed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scan Cargo lockfile
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
