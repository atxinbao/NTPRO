name: nightly-merge

on:
  workflow_dispatch:

jobs:
  disabled:
    name: nightly merge disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain disabled workflow
        run: |
          cat <<'EOF'
          nightly-merge is disabled for NTPRO.

          NTPRO now uses main as the only active development branch. The old
          upstream workflow tried to read nautechsystems/nautilus_trader
          develop runs, fast-forward a nightly branch, and authenticate with
          NIGHTLY_TOKEN. NTPRO has no remote develop or nightly branch, so the
          scheduled workflow is intentionally replaced by this manual no-op.

          If NTPRO needs a nightly channel later, create a dedicated Rust-only
          release workflow instead of restoring the upstream develop/nightly
          merge automation.
          EOF
