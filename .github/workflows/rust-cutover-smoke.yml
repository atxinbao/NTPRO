name: Rust Cutover Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NAUTILUS_RUST_FEATURES: arrow,ffi,high-precision,streaming,defi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          heavy_rust=false
          release_verify=false
          institution_workbench=false
          control_center=false
          mvp_acceptance=false
          if grep -E '^(Cargo\.(toml|lock)|crates/|tests/|examples/|configs/)' /tmp/changed-files.txt >/dev/null; then
            heavy_rust=true
          fi
          if grep -E '^(\.github/(workflows|actions)/|scripts/ai/|docs/rust-cutover/(governance|release|golden_trace)/|tests/golden/|crates/governance/)' /tmp/changed-files.txt >/dev/null; then
            release_verify=true
          fi
          if grep -E '^(crates/cli/src/dashboard/(institution_workbench\.rs|server\.rs|server/tests\.rs)|scripts/ai/test_institution_workbench_(contract|browser)\.mjs)' /tmp/changed-files.txt >/dev/null; then
            institution_workbench=true
          fi
          if grep -E '^(crates/cli/src/dashboard/(control_center\.rs|server\.rs|server/tests\.rs)|scripts/ai/test_control_center_(contract|browser)\.mjs)' /tmp/changed-files.txt >/dev/null; then
            control_center=true
          fi
          if grep -E '^(Cargo\.(toml|lock)|\.cargo/|crates/|scripts/ai/test_mvp_acceptance\.mjs|configs/nodes/btc-ema-shadow\.toml|examples/rust/backtest/minimal_engine_smoke\.toml|\.github/workflows/rust-cutover-smoke\.yml)' /tmp/changed-files.txt >/dev/null; then
            mvp_acceptance=true
          fi
          echo "heavy_rust=$heavy_rust" >>"$GITHUB_OUTPUT"
          echo "release_verify=$release_verify" >>"$GITHUB_OUTPUT"
          echo "institution_workbench=$institution_workbench" >>"$GITHUB_OUTPUT"
          echo "control_center=$control_center" >>"$GITHUB_OUTPUT"
          echo "mvp_acceptance=$mvp_acceptance" >>"$GITHUB_OUTPUT"
      - name: Format and toolchain check
        run: scripts/ai/verify_fast.sh
      - name: Release surface current guard
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
        run: scripts/ai/check_release_surface_current.sh
      - name: Docs and examples governance gate
        run: scripts/ai/check_docs_examples_governance.sh
      - name: Repository zero-Python closeout gate
        run: scripts/ai/check_zero_python_closeout.sh
      - name: Post-freeze backend hygiene gate
        run: scripts/ai/check_backend_hygiene.sh
      - name: Legacy control-plane retirement gate
        run: scripts/ai/check_control_plane_retired.sh
      - name: Historical release executable retirement gate
        run: scripts/ai/check_historical_release_retirement.sh
      - name: Workspace cargo check
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo check --workspace --features "$NAUTILUS_RUST_FEATURES"
      - name: Workspace clippy
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo clippy --workspace --lib --tests --features "$NAUTILUS_RUST_FEATURES" -- -D warnings
      - name: Product path lint warning rollout
        if: steps.changes.outputs.heavy_rust == 'true'
        run: scripts/ai/check_product_path_lints.sh
      - name: Heavy Rust checks skipped
        if: steps.changes.outputs.heavy_rust != 'true'
        run: echo "Skipping workspace compile, clippy, CLI tests, and supervisor smoke."
      - name: Current release verification scripts
        if: steps.changes.outputs.release_verify == 'true'
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
          NTPRO_RELEASE_PUBLISH_AFTER_GATE_LIVE_CURRENT: "0"
          NTPRO_RELEASE_PUBLICATION_ALLOW_OFFLINE: "1"
          NTPRO_V33_ALLOW_POST_RELEASE_HEAD: "1"
        run: |
          find scripts -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 bash -n
          scripts/ai/verify_release.sh current-governance backend-freeze-baseline v33-maintenance-release
          scripts/ai/verify_release_publish_after_gate.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-tag.yml"); YAML.load_file(".github/workflows/release-publish.yml"); puts "release yaml ok"'
      - name: CLI unit tests
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo test -p nautilus-cli --lib
      - name: Institution workbench contract replay
        if: steps.changes.outputs.institution_workbench == 'true'
        run: node scripts/ai/test_institution_workbench_contract.mjs
      - name: Control center contract replay
        if: steps.changes.outputs.control_center == 'true'
        run: node scripts/ai/test_control_center_contract.mjs
      - name: MVP clean deterministic acceptance
        if: steps.changes.outputs.mvp_acceptance == 'true'
        env:
          NTPRO_MVP_ACCEPTANCE_EVIDENCE_DIR: ${{ runner.temp }}/ntpro-mvp-acceptance-evidence
        run: |
          set -euo pipefail
          cargo build -p nautilus-cli --bin nautilus --bin ntpro-node
          node scripts/ai/test_mvp_acceptance.mjs
      - name: Upload MVP acceptance evidence
        if: always() && steps.changes.outputs.mvp_acceptance == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvp-acceptance-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-mvp-acceptance-evidence
          if-no-files-found: error
      - name: Product portal browser smoke
        if: steps.changes.outputs.institution_workbench == 'true' || steps.changes.outputs.control_center == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-match "Noto Sans CJK SC"
          cargo build -p nautilus-cli --bin nautilus --bin ntpro-node
          npm install \
            --prefix "$RUNNER_TEMP/ntpro-playwright" \
            --package-lock=false \
            --no-save \
            playwright-core@1.55.0
          export NTPRO_PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/ntpro-playwright/node_modules/playwright-core"
          export NTPRO_CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          portal_status=0
          if [[ "${{ steps.changes.outputs.institution_workbench }}" == "true" ]]; then
            export NTPRO_BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/ntpro-browser-evidence"
            node scripts/ai/test_institution_workbench_browser.mjs || portal_status=$?
          fi
          if [[ "${{ steps.changes.outputs.control_center }}" == "true" ]]; then
            export NTPRO_BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/ntpro-control-center-browser-evidence"
            node scripts/ai/test_control_center_browser.mjs || portal_status=$?
          fi
          exit "$portal_status"
      - name: Upload institution workbench browser evidence
        if: always() && steps.changes.outputs.institution_workbench == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: institution-workbench-browser-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-browser-evidence
          if-no-files-found: error
      - name: Upload control center browser evidence
        if: always() && steps.changes.outputs.control_center == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-center-browser-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-control-center-browser-evidence
          if-no-files-found: error
      - name: Golden trace schema smoke
        run: scripts/ai/ntpro_governance.sh golden-trace tests/golden/schema_smoke.jsonl --mode validate-only
      - name: Rust-only runtime gate
        run: scripts/ai/check_rust_only_runtime.sh
      - name: Cython removal gate
        run: scripts/ai/check_cython_removed.sh
      - name: Two-node supervisor smoke
        if: steps.changes.outputs.heavy_rust == 'true'
        env:
          NTPRO_V02_009_SKIP_BUILD: "0"
        run: scripts/ai/v02_two_node_supervisor_smoke.sh
