name: Rust Cutover Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NAUTILUS_RUST_FEATURES: arrow,ffi,high-precision,streaming,defi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          heavy_rust=false
          release_verify=false
          if grep -E '^(Cargo\.(toml|lock)|crates/|tests/|examples/|configs/)' /tmp/changed-files.txt >/dev/null; then
            heavy_rust=true
          fi
          if grep -E '^(\.github/(workflows|actions)/|scripts/ai/|docs/rust-cutover/(governance|release|golden_trace)/|tests/golden/|crates/governance/)' /tmp/changed-files.txt >/dev/null; then
            release_verify=true
          fi
          echo "heavy_rust=$heavy_rust" >>"$GITHUB_OUTPUT"
          echo "release_verify=$release_verify" >>"$GITHUB_OUTPUT"
      - name: Format and toolchain check
        run: scripts/ai/verify_fast.sh
      - name: Release surface current guard
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
        run: scripts/ai/check_release_surface_current.sh
      - name: Docs and examples governance gate
        run: scripts/ai/check_docs_examples_governance.sh
      - name: Repository zero-Python closeout gate
        run: scripts/ai/check_zero_python_closeout.sh
      - name: Post-freeze backend hygiene gate
        run: scripts/ai/check_backend_hygiene.sh
      - name: Legacy control-plane retirement gate
        run: scripts/ai/check_control_plane_retired.sh
      - name: Historical release executable retirement gate
        run: scripts/ai/check_historical_release_retirement.sh
      - name: Workspace cargo check
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo check --workspace --features "$NAUTILUS_RUST_FEATURES"
      - name: Workspace clippy
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo clippy --workspace --lib --tests --features "$NAUTILUS_RUST_FEATURES" -- -D warnings
      - name: Product path lint warning rollout
        if: steps.changes.outputs.heavy_rust == 'true'
        run: scripts/ai/check_product_path_lints.sh
      - name: Heavy Rust checks skipped
        if: steps.changes.outputs.heavy_rust != 'true'
        run: echo "Skipping workspace compile, clippy, CLI tests, and supervisor smoke."
      - name: Current release verification scripts
        if: steps.changes.outputs.release_verify == 'true'
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
          NTPRO_RELEASE_PUBLISH_AFTER_GATE_LIVE_CURRENT: "0"
          NTPRO_RELEASE_PUBLICATION_ALLOW_OFFLINE: "1"
          NTPRO_V33_STRICT_OUTPUT: "/tmp/ntpro-v330/v0_33_0_strict_release_manifest.json"
        run: |
          find scripts -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 bash -n
          scripts/ai/verify_release.sh current-governance backend-freeze-baseline v33-maintenance-release v33-strict-provenance
          scripts/ai/verify_release_publish_after_gate.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-tag.yml"); YAML.load_file(".github/workflows/release-publish.yml"); puts "release yaml ok"'
      - name: CLI unit tests
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo test -p nautilus-cli --lib
      - name: Golden trace schema smoke
        run: scripts/ai/ntpro_governance.sh golden-trace tests/golden/schema_smoke.jsonl --mode validate-only
      - name: Rust-only runtime gate
        run: scripts/ai/check_rust_only_runtime.sh
      - name: Cython removal gate
        run: scripts/ai/check_cython_removed.sh
      - name: Two-node supervisor smoke
        if: steps.changes.outputs.heavy_rust == 'true'
        env:
          NTPRO_V02_009_SKIP_BUILD: "0"
        run: scripts/ai/v02_two_node_supervisor_smoke.sh
