name: Rust Cutover Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy_rust: ${{ steps.changes.outputs.heavy_rust }}
      release_verify: ${{ steps.changes.outputs.release_verify }}
      institution_workbench: ${{ steps.changes.outputs.institution_workbench }}
      strategy_workbench: ${{ steps.changes.outputs.strategy_workbench }}
      control_center: ${{ steps.changes.outputs.control_center }}
      mvp_acceptance: ${{ steps.changes.outputs.mvp_acceptance }}
      mvp_fault_matrix: ${{ steps.changes.outputs.mvp_fault_matrix }}
      mvp_final_acceptance: ${{ steps.changes.outputs.mvp_final_acceptance }}
      local_delivery: ${{ steps.changes.outputs.local_delivery }}
      frontend_app: ${{ steps.changes.outputs.frontend_app }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          scripts/ci/classify-ci-changes.sh /tmp/changed-files.txt
      - name: CI change classifier self-test
        run: scripts/ci/test-ci-change-classifier.sh

  smoke_core:
    name: smoke-core
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NAUTILUS_RUST_FEATURES: arrow,ffi,high-precision,streaming,defi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        id: rust
        run: |
          set -euo pipefail
          toolchain="$(bash scripts/rust-toolchain.sh)"
          [[ -n "$toolchain" ]]
          printf 'toolchain=%s\n' "$toolchain" >>"$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
          cache: true
          override: true
      - name: Set up frontend Node.js
        if: needs.changes.outputs.frontend_app == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: apps/strategy-workbench/package-lock.json
      - name: Strategy workbench frontend gate
        if: needs.changes.outputs.frontend_app == 'true'
        working-directory: apps/strategy-workbench
        run: |
          npm ci
          npm run audit
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run test:e2e
      - name: Upload strategy workbench frontend evidence
        if: always() && needs.changes.outputs.frontend_app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strategy-workbench-frontend-${{ github.event.pull_request.number }}
          path: |
            apps/strategy-workbench/test-results
            apps/strategy-workbench/playwright-report
          if-no-files-found: error
      - name: Format and toolchain check
        run: scripts/ai/verify_fast.sh
      - name: Release surface current guard
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
        run: scripts/ai/check_release_surface_current.sh
      - name: Docs and examples governance gate
        run: scripts/ai/check_docs_examples_governance.sh
      - name: Repository zero-Python closeout gate
        run: scripts/ai/check_zero_python_closeout.sh
      - name: Post-freeze backend hygiene gate
        run: scripts/ai/check_backend_hygiene.sh
      - name: Legacy control-plane retirement gate
        run: scripts/ai/check_control_plane_retired.sh
      - name: Historical release executable retirement gate
        run: scripts/ai/check_historical_release_retirement.sh
      - name: Current release verification scripts
        if: needs.changes.outputs.release_verify == 'true'
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
          NTPRO_RELEASE_PUBLISH_AFTER_GATE_LIVE_CURRENT: "0"
          NTPRO_RELEASE_PUBLICATION_ALLOW_OFFLINE: "1"
          NTPRO_V33_ALLOW_POST_RELEASE_HEAD: "1"
          NTPRO_V33_POST_RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          find scripts -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 bash -n
          scripts/ai/verify_release.sh current-governance backend-freeze-baseline v33-maintenance-release
          scripts/ai/verify_release_publish_after_gate.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-tag.yml"); YAML.load_file(".github/workflows/release-publish.yml"); puts "release yaml ok"'
      - name: Institution workbench contract replay
        if: needs.changes.outputs.institution_workbench == 'true'
        run: node scripts/ai/test_institution_workbench_contract.mjs
      - name: Strategy workbench contract replay
        if: needs.changes.outputs.strategy_workbench == 'true'
        working-directory: apps/strategy-workbench
        run: npm run test -- src/api/mvpStatus.test.ts
      - name: Control center contract replay
        if: needs.changes.outputs.control_center == 'true'
        run: node scripts/ai/test_control_center_contract.mjs
      - name: MVP clean deterministic acceptance
        id: mvp_acceptance
        if: needs.changes.outputs.mvp_acceptance == 'true'
        env:
          NTPRO_MVP_ACCEPTANCE_EVIDENCE_DIR: ${{ runner.temp }}/ntpro-mvp-acceptance-evidence
        run: |
          set -euo pipefail
          cargo build -p nautilus-cli --bin nautilus --bin ntpro-node
          node scripts/ai/test_mvp_acceptance.mjs
      - name: Upload MVP acceptance evidence
        if: always() && needs.changes.outputs.mvp_acceptance == 'true' && steps.mvp_acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvp-acceptance-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-mvp-acceptance-evidence
          if-no-files-found: error
      - name: MVP single-node fault matrix
        id: mvp_fault_matrix
        if: needs.changes.outputs.mvp_fault_matrix == 'true'
        env:
          NTPRO_MVP_FAULT_EVIDENCE_DIR: ${{ runner.temp }}/ntpro-mvp-fault-matrix-evidence
        run: |
          set -euo pipefail
          mkdir -p "$NTPRO_MVP_FAULT_EVIDENCE_DIR"
          printf '%s\n' \
            '{"schema_version":"ntpro.mvp_fault_matrix_evidence.v1","status":"fail","phase":"preflight","error":"fault matrix did not start; cargo build or runner setup failed"}' \
            >"$NTPRO_MVP_FAULT_EVIDENCE_DIR/result.json"
          printf '%s\n' 'mvp_fault_matrix=not_started' \
            >"$NTPRO_MVP_FAULT_EVIDENCE_DIR/mvp-fault-matrix.log"
          cargo build -p nautilus-cli --bin nautilus --bin ntpro-node
          node scripts/ai/test_mvp_fault_matrix.mjs

      - name: MVP freeze candidate contract
        if: needs.changes.outputs.mvp_final_acceptance == 'true'
        run: scripts/ai/check_mvp_freeze_baseline.sh
      - name: Upload MVP fault matrix evidence
        if: always() && needs.changes.outputs.mvp_fault_matrix == 'true' && steps.mvp_fault_matrix.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvp-fault-matrix-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-mvp-fault-matrix-evidence
          if-no-files-found: error
      - name: Build product portal browser binaries
        if: needs.changes.outputs.institution_workbench == 'true' || needs.changes.outputs.strategy_workbench == 'true' || needs.changes.outputs.control_center == 'true' || needs.changes.outputs.local_delivery == 'true'
        run: cargo build -p nautilus-cli --bin nautilus --bin ntpro-node
      - name: Product portal browser smoke
        id: portal_browser
        if: needs.changes.outputs.institution_workbench == 'true' || needs.changes.outputs.strategy_workbench == 'true' || needs.changes.outputs.control_center == 'true' || needs.changes.outputs.local_delivery == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-match "Noto Sans CJK SC"
          npm install \
            --prefix "$RUNNER_TEMP/ntpro-playwright" \
            --package-lock=false \
            --no-save \
            playwright-core@1.55.0
          export NTPRO_PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/ntpro-playwright/node_modules/playwright-core"
          export NTPRO_CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          portal_status=0
          if [[ "${{ needs.changes.outputs.institution_workbench }}" == "true" ]]; then
            export NTPRO_BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/ntpro-browser-evidence"
            node scripts/ai/test_institution_workbench_browser.mjs || portal_status=$?
          fi
          if [[ "${{ needs.changes.outputs.strategy_workbench }}" == "true" ]]; then
            export NTPRO_BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/ntpro-strategy-workbench-browser-evidence"
            node scripts/ai/test_strategy_workbench_browser.mjs || portal_status=$?
          fi
          if [[ "${{ needs.changes.outputs.control_center }}" == "true" ]]; then
            export NTPRO_BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/ntpro-control-center-browser-evidence"
            node scripts/ai/test_control_center_browser.mjs || portal_status=$?
          fi
          if [[ "${{ needs.changes.outputs.local_delivery }}" == "true" ]]; then
            export NTPRO_LOCAL_DELIVERY_EVIDENCE_DIR="$RUNNER_TEMP/ntpro-local-delivery-evidence"
            node scripts/ai/test_ntpro_local_delivery.mjs || portal_status=$?
          fi
          exit "$portal_status"
      - name: Upload institution workbench browser evidence
        if: always() && needs.changes.outputs.institution_workbench == 'true' && steps.portal_browser.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: institution-workbench-browser-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-browser-evidence
          if-no-files-found: error
      - name: Upload control center browser evidence
        if: always() && needs.changes.outputs.control_center == 'true' && steps.portal_browser.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-center-browser-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-control-center-browser-evidence
          if-no-files-found: error
      - name: Upload strategy workbench browser evidence
        if: always() && needs.changes.outputs.strategy_workbench == 'true' && steps.portal_browser.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strategy-workbench-browser-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-strategy-workbench-browser-evidence
          if-no-files-found: error
      - name: Upload local delivery evidence
        if: always() && needs.changes.outputs.local_delivery == 'true' && steps.portal_browser.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ntpro-local-delivery-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-local-delivery-evidence
          if-no-files-found: error

      - name: Build MVP final acceptance summary
        id: mvp_final_summary
        if: always() && needs.changes.outputs.mvp_final_acceptance == 'true' && steps.mvp_acceptance.outcome != 'skipped' && steps.mvp_fault_matrix.outcome != 'skipped' && steps.portal_browser.outcome != 'skipped'
        env:
          FINAL_DIR: ${{ runner.temp }}/ntpro-mvp-final-acceptance
          ACCEPTANCE_RESULT: ${{ runner.temp }}/ntpro-mvp-acceptance-evidence/result.json
          FAULT_RESULT: ${{ runner.temp }}/ntpro-mvp-fault-matrix-evidence/result.json
          INSTITUTION_RESULT: ${{ runner.temp }}/ntpro-browser-evidence/result.json
          CONTROL_RESULT: ${{ runner.temp }}/ntpro-control-center-browser-evidence/result.json
        run: |
          set -euo pipefail
          mkdir -p "$FINAL_DIR"
          status=pass
          for result in "$ACCEPTANCE_RESULT" "$FAULT_RESULT" "$INSTITUTION_RESULT" "$CONTROL_RESULT"; do
            if [[ ! -f "$result" ]] || [[ "$(jq -r '.status // "missing"' "$result")" != "pass" ]]; then
              status=fail
            fi
          done
          jq -n \
            --arg status "$status" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg deterministic_status "$(jq -r '.status // "missing"' "$ACCEPTANCE_RESULT" 2>/dev/null || echo missing)" \
            --arg fault_status "$(jq -r '.status // "missing"' "$FAULT_RESULT" 2>/dev/null || echo missing)" \
            --arg institution_status "$(jq -r '.status // "missing"' "$INSTITUTION_RESULT" 2>/dev/null || echo missing)" \
            --arg control_status "$(jq -r '.status // "missing"' "$CONTROL_RESULT" 2>/dev/null || echo missing)" \
            '{
              schema_version: "ntpro.mvp_final_acceptance_evidence.v1",
              status: $status,
              commit_sha: $commit_sha,
              deterministic_loop: $deterministic_status,
              fault_matrix: $fault_status,
              institution_browser: $institution_status,
              control_center_browser: $control_status,
              browser_viewports: ["1440x1000", "390x844"],
              production_trading_authority: false
            }' >"$FINAL_DIR/result.json"
          shasum -a 256 \
            "$ACCEPTANCE_RESULT" \
            "$FAULT_RESULT" \
            "$INSTITUTION_RESULT" \
            "$CONTROL_RESULT" \
            >"$FINAL_DIR/component-sha256.txt" 2>/dev/null || true
          [[ "$status" == "pass" ]]

      - name: Upload MVP final acceptance summary
        if: always() && needs.changes.outputs.mvp_final_acceptance == 'true' && steps.mvp_final_summary.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvp-final-acceptance-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ntpro-mvp-final-acceptance
          if-no-files-found: error
      - name: Golden trace schema smoke
        run: scripts/ai/ntpro_governance.sh golden-trace tests/golden/schema_smoke.jsonl --mode validate-only
      - name: Rust-only runtime gate
        run: scripts/ai/check_rust_only_runtime.sh
      - name: Cython removal gate
        run: scripts/ai/check_cython_removed.sh

  rust_lint:
    name: rust-lint
    needs: changes
    if: needs.changes.outputs.heavy_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAUTILUS_RUST_FEATURES: arrow,ffi,high-precision,streaming,defi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        id: rust
        run: |
          set -euo pipefail
          toolchain="$(bash scripts/rust-toolchain.sh)"
          [[ -n "$toolchain" ]]
          printf 'toolchain=%s\n' "$toolchain" >>"$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
          cache: true
          override: true
      - name: Workspace clippy
        run: cargo clippy --workspace --lib --tests --features "$NAUTILUS_RUST_FEATURES" -- -D warnings
      - name: Product path lint warning rollout
        run: scripts/ai/check_product_path_lints.sh

  rust_tests:
    name: rust-tests
    needs: changes
    if: needs.changes.outputs.heavy_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        id: rust
        run: |
          set -euo pipefail
          toolchain="$(bash scripts/rust-toolchain.sh)"
          [[ -n "$toolchain" ]]
          printf 'toolchain=%s\n' "$toolchain" >>"$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          cache: true
          override: true
      - name: CLI unit tests
        run: cargo test -p nautilus-cli --lib
      - name: Two-node supervisor smoke
        env:
          NTPRO_V02_009_SKIP_BUILD: "0"
        run: scripts/ai/v02_two_node_supervisor_smoke.sh

  smoke:
    if: always()
    needs: [changes, smoke_core, rust_lint, rust_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Aggregate required pull-request gates
        env:
          HEAVY_RUST: ${{ needs.changes.outputs.heavy_rust }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CORE_RESULT: ${{ needs.smoke_core.result }}
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
        run: bash scripts/ci/aggregate-pr-smoke.sh
