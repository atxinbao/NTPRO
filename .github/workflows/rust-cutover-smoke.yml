name: Rust Cutover Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NAUTILUS_RUST_FEATURES: arrow,ffi,high-precision,streaming,defi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          if [ ! -s /tmp/changed-files.txt ]; then
            echo "heavy_rust=true" >> "$GITHUB_OUTPUT"
            echo "release_verify=false" >> "$GITHUB_OUTPUT"
            echo "v06_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v07_smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -E '^(crates/cli/src/(workflow|dashboard|opt)\.rs|examples/rust/binance/testnet_dry_run\.toml|scripts/ai/verify_v06_binance_testnet_dry_run\.sh|docs/rust-cutover/product/V06_BINANCE_TESTNET_DRY_RUN_USER_GUIDE\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v06_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.6 Binance testnet dry-run smoke required by changed files"
          else
            echo "v06_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(crates/cli/src/(workflow|workflow_contract|dashboard|opt)\.rs|examples/rust/binance/testnet_dry_run\.toml|scripts/ai/verify_v07_default_offline_gate\.sh|scripts/ai/verify_v07_manual_online_gate\.sh|docs/rust-cutover/release/v0_7_0_readonly_testnet_boundary\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v07_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.7 Binance testnet read-only gate smoke required by changed files"
          else
            echo "v07_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Ev '^(README\.md|CHANGELOG.*|MIGRATION.*|docs/|release/|\.agentflow/|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md|workflows/(release-tag|rust-cutover-smoke)\.yml)|scripts/ai/(verify_full|verify_release|v03_dashboard_smoke|verify_v05_workflow_artifacts|verify_v06_binance_testnet_dry_run|verify_v07_default_offline_gate|verify_v07_manual_online_gate)\.sh|\.gitignore$)' /tmp/changed-files.txt >/tmp/heavy-files.txt; then
            echo "heavy_rust=true" >> "$GITHUB_OUTPUT"
            echo "release_verify=false" >> "$GITHUB_OUTPUT"
            echo "heavy Rust checks required by:"
            cat /tmp/heavy-files.txt
          else
            echo "heavy_rust=false" >> "$GITHUB_OUTPUT"
            if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|scripts/ai/(verify_full|verify_release|v03_dashboard_smoke|verify_v05_workflow_artifacts|verify_v06_binance_testnet_dry_run|verify_v07_default_offline_gate|verify_v07_manual_online_gate)\.sh|docs/rust-cutover/evidence/GH-RELEASE-)' /tmp/changed-files.txt >/dev/null; then
              echo "release_verify=true" >> "$GITHUB_OUTPUT"
              echo "heavy Rust checks skipped for release verification script/workflow change set"
            else
              echo "release_verify=false" >> "$GITHUB_OUTPUT"
              echo "heavy Rust checks skipped for docs/local-state-only change set"
            fi
          fi
      - name: Format and toolchain check
        run: scripts/ai/verify_fast.sh
      - name: Workspace cargo check
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo check --workspace --features "$NAUTILUS_RUST_FEATURES"
      - name: Workspace clippy
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo clippy --workspace --lib --tests --features "$NAUTILUS_RUST_FEATURES" -- -D warnings
      - name: Product path lint warning rollout
        if: steps.changes.outputs.heavy_rust == 'true'
        run: scripts/ai/check_product_path_lints.sh
      - name: Heavy Rust checks skipped
        if: steps.changes.outputs.heavy_rust != 'true'
        run: echo "Skipping cargo check, clippy, CLI unit tests, and supervisor smoke for docs/local-state/release-verification-only changes."
      - name: Release verification script checks
        if: steps.changes.outputs.release_verify == 'true'
        run: |
          bash -n scripts/ai/verify_full.sh scripts/ai/verify_release.sh scripts/ai/v03_dashboard_smoke.sh scripts/ai/verify_v05_workflow_artifacts.sh scripts/ai/verify_v06_binance_testnet_dry_run.sh scripts/ai/verify_v07_default_offline_gate.sh scripts/ai/verify_v07_manual_online_gate.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-tag.yml"); puts "release-tag yaml ok"'
      - name: CLI unit tests
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo test -p nautilus-cli --lib
      - name: v06-binance-testnet-dry-run-smoke
        if: steps.changes.outputs.v06_smoke == 'true'
        run: scripts/ai/verify_v06_binance_testnet_dry_run.sh
      - name: v07-default-offline-gate
        if: steps.changes.outputs.v07_smoke == 'true'
        run: scripts/ai/verify_v07_default_offline_gate.sh
      - name: v07-manual-online-preflight
        if: steps.changes.outputs.v07_smoke == 'true'
        run: scripts/ai/verify_v07_manual_online_gate.sh
      - name: Golden trace schema smoke
        run: python scripts/ai/golden_trace_runner.py tests/golden/schema_smoke.jsonl --mode validate-only
      - name: Rust-only runtime gate
        run: scripts/ai/check_rust_only_runtime.sh
      - name: Cython removal gate
        run: scripts/ai/check_cython_removed.sh
      - name: v0.2 two-node supervisor smoke
        if: steps.changes.outputs.heavy_rust == 'true'
        env:
          NTPRO_V02_009_SKIP_BUILD: "0"
        run: scripts/ai/v02_two_node_supervisor_smoke.sh
