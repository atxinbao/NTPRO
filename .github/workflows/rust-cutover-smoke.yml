name: Rust Cutover Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NAUTILUS_RUST_FEATURES: arrow,ffi,high-precision,streaming,defi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          if [ ! -s /tmp/changed-files.txt ]; then
            echo "heavy_rust=true" >> "$GITHUB_OUTPUT"
            echo "release_verify=false" >> "$GITHUB_OUTPUT"
            echo "v06_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v07_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v08_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v09_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v10_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v11_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v12_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v13_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v14_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v15_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v151_smoke=false" >> "$GITHUB_OUTPUT"
            echo "v16_smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -E '^(crates/cli/src/(workflow|dashboard|opt)\.rs|examples/rust/binance/testnet_dry_run\.toml|scripts/ai/verify_v06_binance_testnet_dry_run\.sh|docs/rust-cutover/product/V06_BINANCE_TESTNET_DRY_RUN_USER_GUIDE\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v06_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.6 Binance testnet dry-run smoke required by changed files"
          else
            echo "v06_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(crates/cli/src/(workflow|workflow_contract|dashboard|opt)\.rs|examples/rust/binance/testnet_dry_run\.toml|scripts/ai/verify_v07_default_offline_gate\.sh|scripts/ai/verify_v07_manual_online_gate\.sh|docs/rust-cutover/release/v0_7_0_readonly_testnet_boundary\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v07_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.7 Binance testnet read-only gate smoke required by changed files"
          else
            echo "v07_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(crates/cli/src/(workflow|workflow_contract|dashboard|opt)\.rs|examples/rust/binance/testnet_dry_run\.toml|scripts/ai/(scan_v08_synthetic_secret_leaks|verify_v08_default_offline_gate|verify_v08_authenticated_readonly_gate)\.sh|docs/rust-cutover/release/v0_8_0_authenticated_readonly_boundary\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v08_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.8 Binance testnet synthetic secret leak gate required by changed files"
          else
            echo "v08_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(crates/cli/src/(live|strategy_session|supervisor|dashboard|opt)\.rs|configs/nodes/btc-ema-shadow\.toml|scripts/ai/verify_v09_(strategy_runtime_smoke|shadow_mode_no_order_gate)\.sh|scripts/ai/verify_v091_strategy_supervisor_dashboard_integration\.sh|docs/rust-cutover/release/v0_9_0_.*\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v09_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.9 Strategy Runtime smoke required by changed files"
          else
            echo "v09_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(crates/cli/src/(live|dashboard|opt)\.rs|configs/nodes/btc-ema-shadow\.toml|scripts/ai/verify_v10_(offline_fail_closed|order_preflight|signed_order_request|order_test_preflight|execution_artifact_contract|reconciliation_fixture|offline_release_gates|manual_order_proof_gate)\.sh|docs/rust-cutover/release/v0_10_0_.*\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v10_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.10 Binance testnet order proof offline gates required by changed files"
          else
            echo "v10_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(crates/cli/src/(dashboard|live|opt)\.rs|scripts/ai/(verify_v11_public_read_probe|verify_v11_authenticated_account_snapshot_contract|verify_v11_offline_release_gates)\.sh|docs/rust-cutover/release/v0_11_0_.*\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v11_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.11 production read-only/shadow offline gates required by changed files"
          else
            echo "v11_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|crates/cli/src/(dashboard|live|opt)\.rs|scripts/ai/(verify_release|verify_v12_public_online_read_probe|verify_v12_authenticated_account_snapshot_online_read|verify_v12_response_shape|verify_v12_shadow_portfolio_runtime|verify_v12_persistent_shadow_strategy_session|verify_v12_production_readonly_reconciliation|verify_v12_offline_release_gates|verify_v12_manual_online_preflight)\.sh|docs/rust-cutover/release/v0_12_0_.*\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v12_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.12 production online read-only/shadow offline gates required by changed files"
          else
            echo "v12_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|crates/cli/src/(dashboard|live|opt)\.rs|scripts/ai/(verify_release|verify_v13_shadow_preflight_session|verify_v13_online_readonly_proof_pack|verify_v13_kill_switch_approval_artifact|verify_v13_dashboard_control_boundary|verify_v13_decimal_amount_boundary|verify_v13_no_production_mutation_gate)\.sh|docs/rust-cutover/release/v0_13_0_.*\.md)$' /tmp/changed-files.txt >/dev/null; then
            echo "v13_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.13 no-production-mutation gate required by changed files"
          else
            echo "v13_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|crates/cli/src/(dashboard|live|opt|supervisor|strategy_session)\.rs|configs/nodes/btc-ema-shadow\.toml|scripts/ai/(verify_release|verify_v14_order_state_readonly_proof|verify_v14_supervisor_shadow_runtime|verify_v14_live_alpha_dry_run_order_gate|verify_v14_live_alpha_risk_preflight|verify_v14_release_gates)\.sh|tests/golden/live_alpha_reconciliation_schema\.jsonl|crates/cli/tests/golden_trace_live_alpha_reconciliation\.rs|docs/rust-cutover/(release/v0_14_0_.*\.md|evidence/V140-.*\.md|tasks/V140-.*\.md|golden_trace/(RELEASE_REPLAY_SCOPE\.json|SCHEMA\.md)))$' /tmp/changed-files.txt >/dev/null; then
            echo "v14_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.14 release gates required by changed files"
          else
            echo "v14_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|crates/cli/src/dashboard\.rs|scripts/ai/(run_golden_traces|verify_full|verify_release|verify_v15_live_order_request_dry_run_builder|verify_v15_manual_approval_lifecycle|verify_v15_execution_adapter_isolation|verify_v15_kill_switch_runtime_enforcement|verify_v15_incident_rollback_artifact|verify_v15_release_gates)\.sh|tests/golden/live_alpha_mutation_dry_run_schema\.jsonl|crates/cli/tests/golden_trace_live_alpha_mutation_dry_run\.rs|docs/rust-cutover/(release/v0_15_0_.*\.md|evidence/V150-.*\.md|tasks/V150-.*\.md|golden_trace/(RELEASE_REPLAY_SCOPE\.json|SCHEMA\.md)))$' /tmp/changed-files.txt >/dev/null; then
            echo "v15_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.15 mutation dry-run golden trace smoke required by changed files"
          else
            echo "v15_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|scripts/ai/(verify_release|verify_v151_release_gates)\.sh|docs/rust-cutover/(release/v0_15_1_.*\.md|evidence/V151-.*\.md|tasks/V151-.*\.md))$' /tmp/changed-files.txt >/dev/null; then
            echo "v151_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.15.1 aggregate release gates required by changed files"
          else
            echo "v151_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|crates/cli/src/(dashboard|live|opt)\.rs|scripts/ai/(verify_release|verify_v16_[A-Za-z0-9_]+)\.sh|docs/rust-cutover/(release/v0_16_0_.*\.md|evidence/V160-.*\.md|tasks/V160-.*\.md))$' /tmp/changed-files.txt >/dev/null; then
            echo "v16_smoke=true" >> "$GITHUB_OUTPUT"
            echo "v0.16 production mutation candidate release gates required by changed files"
          else
            echo "v16_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Ev '^(README\.md|ROADMAP\.md|CHANGELOG.*|MIGRATION.*|docs/|release/|\.agentflow/|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md|workflows/(release-tag|rust-cutover-smoke)\.yml)|scripts/ai/(check_github_release_published|check_release_surface_current|verify_full|verify_release|v03_dashboard_smoke|verify_v05_workflow_artifacts|verify_v06_binance_testnet_dry_run|verify_v07_default_offline_gate|verify_v07_manual_online_gate|scan_v08_synthetic_secret_leaks|verify_v08_default_offline_gate|verify_v08_authenticated_readonly_gate|verify_v09_strategy_runtime_smoke|verify_v09_shadow_mode_no_order_gate|verify_v091_strategy_supervisor_dashboard_integration|verify_v10_offline_fail_closed|verify_v10_order_preflight|verify_v10_signed_order_request|verify_v10_order_test_preflight|verify_v10_execution_artifact_contract|verify_v10_reconciliation_fixture|verify_v10_offline_release_gates|verify_v10_manual_order_proof_gate|verify_v11_public_read_probe|verify_v11_authenticated_account_snapshot_contract|verify_v11_offline_release_gates|verify_v12_public_online_read_probe|verify_v12_authenticated_account_snapshot_online_read|verify_v12_response_shape|verify_v12_shadow_portfolio_runtime|verify_v12_persistent_shadow_strategy_session|verify_v12_production_readonly_reconciliation|verify_v12_offline_release_gates|verify_v12_manual_online_preflight|verify_v13_shadow_preflight_session|verify_v13_online_readonly_proof_pack|verify_v13_kill_switch_approval_artifact|verify_v13_dashboard_control_boundary|verify_v13_decimal_amount_boundary|verify_v13_no_production_mutation_gate|verify_v14_order_state_readonly_proof|verify_v14_supervisor_shadow_runtime|verify_v14_live_alpha_dry_run_order_gate|verify_v14_live_alpha_risk_preflight|verify_v14_release_gates|verify_v15_live_order_request_dry_run_builder|verify_v15_manual_approval_lifecycle|verify_v15_execution_adapter_isolation|verify_v15_kill_switch_runtime_enforcement|verify_v15_incident_rollback_artifact|verify_v15_release_gates|verify_v151_release_gates|verify_v16_[A-Za-z0-9_]+)\.sh|\.gitignore$)' /tmp/changed-files.txt >/tmp/heavy-files.txt; then
            echo "heavy_rust=true" >> "$GITHUB_OUTPUT"
            echo "release_verify=false" >> "$GITHUB_OUTPUT"
            echo "heavy Rust checks required by:"
            cat /tmp/heavy-files.txt
          else
            echo "heavy_rust=false" >> "$GITHUB_OUTPUT"
            if grep -E '^(\.github/workflows/(release-tag|rust-cutover-smoke)\.yml|scripts/ai/(check_github_release_published|check_release_surface_current|verify_full|verify_release|v03_dashboard_smoke|verify_v05_workflow_artifacts|verify_v06_binance_testnet_dry_run|verify_v07_default_offline_gate|verify_v07_manual_online_gate|scan_v08_synthetic_secret_leaks|verify_v08_default_offline_gate|verify_v08_authenticated_readonly_gate|verify_v09_strategy_runtime_smoke|verify_v09_shadow_mode_no_order_gate|verify_v091_strategy_supervisor_dashboard_integration|verify_v10_offline_fail_closed|verify_v10_order_preflight|verify_v10_signed_order_request|verify_v10_order_test_preflight|verify_v10_execution_artifact_contract|verify_v10_reconciliation_fixture|verify_v10_offline_release_gates|verify_v10_manual_order_proof_gate|verify_v11_public_read_probe|verify_v11_authenticated_account_snapshot_contract|verify_v11_offline_release_gates|verify_v12_public_online_read_probe|verify_v12_authenticated_account_snapshot_online_read|verify_v12_response_shape|verify_v12_shadow_portfolio_runtime|verify_v12_persistent_shadow_strategy_session|verify_v12_production_readonly_reconciliation|verify_v12_offline_release_gates|verify_v12_manual_online_preflight|verify_v13_shadow_preflight_session|verify_v13_online_readonly_proof_pack|verify_v13_kill_switch_approval_artifact|verify_v13_dashboard_control_boundary|verify_v13_decimal_amount_boundary|verify_v13_no_production_mutation_gate|verify_v14_order_state_readonly_proof|verify_v14_supervisor_shadow_runtime|verify_v14_live_alpha_dry_run_order_gate|verify_v14_live_alpha_risk_preflight|verify_v14_release_gates|verify_v15_live_order_request_dry_run_builder|verify_v15_manual_approval_lifecycle|verify_v15_execution_adapter_isolation|verify_v15_kill_switch_runtime_enforcement|verify_v15_incident_rollback_artifact|verify_v15_release_gates|verify_v151_release_gates|verify_v16_[A-Za-z0-9_]+)\.sh|docs/rust-cutover/evidence/GH-RELEASE-)' /tmp/changed-files.txt >/dev/null; then
              echo "release_verify=true" >> "$GITHUB_OUTPUT"
              echo "heavy Rust checks skipped for release verification script/workflow change set"
            else
              echo "release_verify=false" >> "$GITHUB_OUTPUT"
              echo "heavy Rust checks skipped for docs/local-state-only change set"
            fi
          fi
      - name: Format and toolchain check
        run: scripts/ai/verify_fast.sh
      - name: Release surface current guard
        env:
          NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: "1"
        run: scripts/ai/check_release_surface_current.sh
      - name: Workspace cargo check
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo check --workspace --features "$NAUTILUS_RUST_FEATURES"
      - name: Workspace clippy
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo clippy --workspace --lib --tests --features "$NAUTILUS_RUST_FEATURES" -- -D warnings
      - name: Product path lint warning rollout
        if: steps.changes.outputs.heavy_rust == 'true'
        run: scripts/ai/check_product_path_lints.sh
      - name: Heavy Rust checks skipped
        if: steps.changes.outputs.heavy_rust != 'true'
        run: echo "Skipping cargo check, clippy, CLI unit tests, and supervisor smoke for docs/local-state/release-verification-only changes."
      - name: Release verification script checks
        if: steps.changes.outputs.release_verify == 'true'
        run: |
          bash -n scripts/ai/check_github_release_published.sh scripts/ai/check_release_surface_current.sh scripts/ai/verify_full.sh scripts/ai/verify_release.sh scripts/ai/v03_dashboard_smoke.sh scripts/ai/verify_v05_workflow_artifacts.sh scripts/ai/verify_v06_binance_testnet_dry_run.sh scripts/ai/verify_v07_default_offline_gate.sh scripts/ai/verify_v07_manual_online_gate.sh scripts/ai/scan_v08_synthetic_secret_leaks.sh scripts/ai/verify_v08_default_offline_gate.sh scripts/ai/verify_v08_authenticated_readonly_gate.sh scripts/ai/verify_v09_strategy_runtime_smoke.sh scripts/ai/verify_v09_shadow_mode_no_order_gate.sh scripts/ai/verify_v091_strategy_supervisor_dashboard_integration.sh scripts/ai/verify_v10_offline_fail_closed.sh scripts/ai/verify_v10_order_preflight.sh scripts/ai/verify_v10_signed_order_request.sh scripts/ai/verify_v10_order_test_preflight.sh scripts/ai/verify_v10_execution_artifact_contract.sh scripts/ai/verify_v10_reconciliation_fixture.sh scripts/ai/verify_v10_offline_release_gates.sh scripts/ai/verify_v10_manual_order_proof_gate.sh scripts/ai/verify_v11_public_read_probe.sh scripts/ai/verify_v11_authenticated_account_snapshot_contract.sh scripts/ai/verify_v11_offline_release_gates.sh scripts/ai/verify_v12_public_online_read_probe.sh scripts/ai/verify_v12_authenticated_account_snapshot_online_read.sh scripts/ai/verify_v12_response_shape.sh scripts/ai/verify_v12_shadow_portfolio_runtime.sh scripts/ai/verify_v12_persistent_shadow_strategy_session.sh scripts/ai/verify_v12_production_readonly_reconciliation.sh scripts/ai/verify_v12_offline_release_gates.sh scripts/ai/verify_v12_manual_online_preflight.sh scripts/ai/verify_v13_shadow_preflight_session.sh scripts/ai/verify_v13_online_readonly_proof_pack.sh scripts/ai/verify_v13_kill_switch_approval_artifact.sh scripts/ai/verify_v13_dashboard_control_boundary.sh scripts/ai/verify_v13_decimal_amount_boundary.sh scripts/ai/verify_v13_no_production_mutation_gate.sh scripts/ai/verify_v14_order_state_readonly_proof.sh scripts/ai/verify_v14_supervisor_shadow_runtime.sh scripts/ai/verify_v14_live_alpha_dry_run_order_gate.sh scripts/ai/verify_v14_live_alpha_risk_preflight.sh scripts/ai/verify_v14_release_gates.sh scripts/ai/verify_v15_live_order_request_dry_run_builder.sh scripts/ai/verify_v15_manual_approval_lifecycle.sh scripts/ai/verify_v15_execution_adapter_isolation.sh scripts/ai/verify_v15_kill_switch_runtime_enforcement.sh scripts/ai/verify_v15_incident_rollback_artifact.sh scripts/ai/verify_v15_release_gates.sh scripts/ai/verify_v151_release_gates.sh scripts/ai/verify_v16_*.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-tag.yml"); puts "release-tag yaml ok"'
      - name: CLI unit tests
        if: steps.changes.outputs.heavy_rust == 'true'
        run: cargo test -p nautilus-cli --lib
      - name: v06-binance-testnet-dry-run-smoke
        if: steps.changes.outputs.v06_smoke == 'true'
        run: scripts/ai/verify_v06_binance_testnet_dry_run.sh
      - name: v07-default-offline-gate
        if: steps.changes.outputs.v07_smoke == 'true'
        run: scripts/ai/verify_v07_default_offline_gate.sh
      - name: v07-manual-online-preflight
        if: steps.changes.outputs.v07_smoke == 'true'
        run: scripts/ai/verify_v07_manual_online_gate.sh
      - name: v08-default-offline-gate
        if: steps.changes.outputs.v08_smoke == 'true'
        run: scripts/ai/verify_v08_default_offline_gate.sh
      - name: v08-authenticated-readonly-preflight
        if: steps.changes.outputs.v08_smoke == 'true'
        run: scripts/ai/verify_v08_authenticated_readonly_gate.sh
      - name: v09-strategy-runtime-smoke
        if: steps.changes.outputs.v09_smoke == 'true'
        run: scripts/ai/verify_v09_strategy_runtime_smoke.sh
      - name: v09-shadow-mode-no-order-gate
        if: steps.changes.outputs.v09_smoke == 'true'
        run: scripts/ai/verify_v09_shadow_mode_no_order_gate.sh
      - name: v091-strategy-supervisor-dashboard-integration
        if: steps.changes.outputs.v09_smoke == 'true'
        run: scripts/ai/verify_v091_strategy_supervisor_dashboard_integration.sh
      - name: v10-offline-release-gates
        if: steps.changes.outputs.v10_smoke == 'true'
        run: scripts/ai/verify_v10_offline_release_gates.sh
      - name: v10-manual-order-proof-preflight
        if: steps.changes.outputs.v10_smoke == 'true'
        run: scripts/ai/verify_v10_manual_order_proof_gate.sh
      - name: v11-offline-release-gates
        if: steps.changes.outputs.v11_smoke == 'true'
        env:
          NTPRO_V11_LIGHTWEIGHT: "1"
        run: scripts/ai/verify_v11_offline_release_gates.sh
      - name: v12-offline-release-gates
        if: steps.changes.outputs.v12_smoke == 'true'
        run: scripts/ai/verify_v12_offline_release_gates.sh
      - name: v12-manual-online-preflight
        if: steps.changes.outputs.v12_smoke == 'true'
        run: scripts/ai/verify_v12_manual_online_preflight.sh
      - name: v13-no-production-mutation-gate
        if: steps.changes.outputs.v13_smoke == 'true'
        run: scripts/ai/verify_v13_no_production_mutation_gate.sh
      - name: v14-release-gates
        if: steps.changes.outputs.v14_smoke == 'true'
        run: scripts/ai/verify_v14_release_gates.sh
      - name: v15-release-gates
        if: steps.changes.outputs.v15_smoke == 'true'
        run: scripts/ai/verify_v15_release_gates.sh
      - name: v151-release-gates
        if: steps.changes.outputs.v151_smoke == 'true'
        run: scripts/ai/verify_v151_release_gates.sh
      - name: v16-release-gates
        if: steps.changes.outputs.v16_smoke == 'true'
        run: scripts/ai/verify_v16_release_gates.sh
      - name: Golden trace schema smoke
        run: python scripts/ai/golden_trace_runner.py tests/golden/schema_smoke.jsonl --mode validate-only
      - name: Rust-only runtime gate
        run: scripts/ai/check_rust_only_runtime.sh
      - name: Cython removal gate
        run: scripts/ai/check_cython_removed.sh
      - name: v0.2 two-node supervisor smoke
        if: steps.changes.outputs.heavy_rust == 'true'
        env:
          NTPRO_V02_009_SKIP_BUILD: "0"
        run: scripts/ai/v02_two_node_supervisor_smoke.sh
