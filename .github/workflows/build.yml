name: Rust build

on:
  workflow_dispatch:
  push:
    branches: [test-ci, nightly]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Common Rust setup
        uses: ./.github/actions/common-setup
        with:
          build-type: pre-commit
          free-disk-space: "true"
      - name: Run repository hooks
        run: prek run --all-files

  workspace-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --features arrow,ffi,high-precision,streaming,defi
      - name: Lint workspace
        run: cargo clippy --workspace --lib --tests --features arrow,ffi,high-precision,streaming,defi -- -D warnings

  rust-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        stage:
          - rust-tests-workspace-core
          - rust-tests-workspace-runtime
          - rust-tests-workspace-adapters-a
          - rust-tests-workspace-adapters-b
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          cache: true
          override: true
      - name: Run Rust test stage
        env:
          STAGE: ${{ matrix.stage }}
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        run: scripts/ai/verify_full.sh "$STAGE"
