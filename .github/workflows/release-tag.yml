            command: scripts/ai/verify_v32_strict_provenance.sh
            expected_tag: ntpro-rust-only-v0.32.0
          - stage: release-surface-current-guard
            command: scripts/ai/verify_release.sh release-surface-current-guard
          - stage: release-publication-guard
            command: scripts/ai/verify_release.sh release-publication-guard
          - stage: release-publish-after-gate
            command: scripts/ai/verify_release.sh release-publish-after-gate
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      NTPRO_RELEASE_PUBLICATION_ALLOW_OFFLINE: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reclaim runner disk
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h

      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true

      - name: Verify release gate stage
        env:
          NTPRO_RELEASE_GATE: "1"
          NTPRO_V02_009_SKIP_BUILD: "0"
          NTPRO_RELEASE_STAGE: ${{ matrix.stage }}
          NTPRO_EXPECTED_RELEASE_TAG: ${{ matrix.expected_tag }}
        run: |
          if [[ -n "${NTPRO_EXPECTED_RELEASE_TAG}" ]]; then
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
              echo "release tag-scoped stage skipped: stage=${NTPRO_RELEASE_STAGE} expected_tag=${NTPRO_EXPECTED_RELEASE_TAG} ref_type=${GITHUB_REF_TYPE:-unknown}"
              exit 0
            fi
            if [[ "${GITHUB_REF_NAME:-}" != "${NTPRO_EXPECTED_RELEASE_TAG}" ]]; then
              echo "release tag-scoped stage skipped: stage=${NTPRO_RELEASE_STAGE} expected_tag=${NTPRO_EXPECTED_RELEASE_TAG} actual_tag=${GITHUB_REF_NAME:-unknown}"
              exit 0
            fi
          fi
          if [[ "${NTPRO_RELEASE_STAGE}" == "release-publication-guard" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            export NTPRO_RELEASE_PUBLICATION_PREPUBLISH_TAG_GATE=1
          fi
          if [[ "${NTPRO_RELEASE_STAGE}" == "release-publish-after-gate" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            export NTPRO_RELEASE_PUBLISH_AFTER_GATE_LIVE_CURRENT=0
            export NTPRO_RELEASE_PUBLISH_AFTER_GATE_REQUIRE_LIVE_CURRENT=0
          fi
          ${{ matrix.command }}

  verify-release:
    name: verify-release
    runs-on: ubuntu-latest
    needs:
      - release-stage
    if: always()
    steps:
      - name: Summarize release gate
        run: |
          echo "release-stage result: ${{ needs.release-stage.result }}"
          if [[ "${{ needs.release-stage.result }}" != "success" ]]; then
            exit 1
          fi
          echo "release gate status=ok"
