name: Rust Cutover Release Gate

on:
  push:
    tags:
      - "ntpro-rust-only-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-stage:
    name: verify-release (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: full-fast
            command: scripts/ai/verify_full.sh fast
          - stage: full-clippy
            command: scripts/ai/verify_full.sh clippy
          - stage: full-rust-tests-workspace-core
            command: scripts/ai/verify_full.sh rust-tests-workspace-core
          - stage: full-rust-tests-workspace-runtime
            command: scripts/ai/verify_full.sh rust-tests-workspace-runtime
          - stage: full-rust-tests-workspace-adapters-a
            command: scripts/ai/verify_full.sh rust-tests-workspace-adapters-a
          - stage: full-rust-tests-workspace-adapters-b
            command: scripts/ai/verify_full.sh rust-tests-workspace-adapters-b
          - stage: full-rust-tests-common-log-global
            command: scripts/ai/verify_full.sh rust-tests-common-log-global
          - stage: full-rust-tests-live-log-global
            command: scripts/ai/verify_full.sh rust-tests-live-log-global
          - stage: full-rust-tests-live-node-serial
            command: scripts/ai/verify_full.sh rust-tests-live-node-serial
          - stage: full-golden-traces-files
            command: scripts/ai/verify_full.sh golden-traces-files
          - stage: full-golden-traces-harness
            command: scripts/ai/verify_full.sh golden-traces-harness
          - stage: full-golden-traces-market-data
            command: scripts/ai/verify_full.sh golden-traces-market-data
          - stage: full-golden-traces-cache-msgbus
            command: scripts/ai/verify_full.sh golden-traces-cache-msgbus
          - stage: full-golden-traces-backtest
            command: scripts/ai/verify_full.sh golden-traces-backtest
          - stage: full-golden-traces-backtest-live-parity
            command: scripts/ai/verify_full.sh golden-traces-backtest-live-parity
          - stage: full-golden-traces-live-sandbox
            command: scripts/ai/verify_full.sh golden-traces-live-sandbox
          - stage: full-golden-traces-order-lifecycle
            command: scripts/ai/verify_full.sh golden-traces-order-lifecycle
          - stage: full-golden-traces-risk-rejection
            command: scripts/ai/verify_full.sh golden-traces-risk-rejection
          - stage: full-golden-traces-adapter-payload
            command: scripts/ai/verify_full.sh golden-traces-adapter-payload
          - stage: full-golden-traces-live-alpha-reconciliation
            command: scripts/ai/verify_full.sh golden-traces-live-alpha-reconciliation
          - stage: full-golden-traces-live-alpha-mutation-dry-run
            command: scripts/ai/verify_full.sh golden-traces-live-alpha-mutation-dry-run
          - stage: full-rust-docs
            command: scripts/ai/verify_full.sh rust-docs
          - stage: release-build-product-surface
            command: scripts/ai/verify_release.sh release-build-product-surface
          - stage: release-rust-only-gates
            command: scripts/ai/verify_release.sh rust-only-gates
          - stage: release-v02-supervisor-smoke
            command: scripts/ai/verify_release.sh v02-supervisor-smoke
          - stage: release-v03-supervisor-control-smoke
            command: scripts/ai/verify_release.sh v03-supervisor-control-smoke
          - stage: release-v03-dashboard-smoke
            command: scripts/ai/verify_release.sh v03-dashboard-smoke
          - stage: release-v05-workflow-artifacts-smoke
            command: scripts/ai/verify_release.sh v05-workflow-artifacts-smoke
          - stage: release-v06-binance-testnet-dry-run-smoke
            command: scripts/ai/verify_release.sh v06-binance-testnet-dry-run-smoke
          - stage: release-v07-default-offline-gate
            command: scripts/ai/verify_release.sh v07-default-offline-gate
          - stage: release-v07-manual-online-preflight
            command: scripts/ai/verify_release.sh v07-manual-online-preflight
          - stage: release-v08-default-offline-gate
            command: scripts/ai/verify_release.sh v08-default-offline-gate
          - stage: release-v08-authenticated-readonly-preflight
            command: scripts/ai/verify_release.sh v08-authenticated-readonly-preflight
          - stage: release-v09-strategy-runtime-smoke
            command: scripts/ai/verify_release.sh v09-strategy-runtime-smoke
          - stage: release-v09-shadow-mode-no-order-gate
            command: scripts/ai/verify_release.sh v09-shadow-mode-no-order-gate
          - stage: release-v091-strategy-supervisor-dashboard-integration
            command: scripts/ai/verify_release.sh v091-strategy-supervisor-dashboard-integration
          - stage: release-v10-offline-release-gates
            command: scripts/ai/verify_release.sh v10-offline-release-gates
          - stage: release-v10-manual-order-proof-preflight
            command: scripts/ai/verify_release.sh v10-manual-order-proof-preflight
          - stage: release-v11-offline-release-gates
            command: scripts/ai/verify_release.sh v11-offline-release-gates
          - stage: release-v12-offline-release-gates
            command: scripts/ai/verify_release.sh v12-offline-release-gates
          - stage: release-v12-manual-online-preflight
            command: scripts/ai/verify_release.sh v12-manual-online-preflight
          - stage: release-v13-no-production-mutation-gate
            command: scripts/ai/verify_release.sh v13-no-production-mutation-gate
          - stage: release-v14-release-gates
            command: scripts/ai/verify_release.sh v14-release-gates
          - stage: release-v15-release-gates
            command: scripts/ai/verify_release.sh v15-release-gates
          - stage: release-v16-release-gates
            command: scripts/ai/verify_release.sh v16-release-gates
          - stage: release-v17-release-gates
            command: scripts/ai/verify_release.sh v17-release-gates
          - stage: release-v18-release-gates
            command: scripts/ai/verify_release.sh v18-release-gates
          - stage: release-v19-release-gates
            command: scripts/ai/verify_release.sh v19-release-gates
          - stage: release-v20-release-gates
            command: scripts/ai/verify_release.sh v20-release-gates
          - stage: release-v20-strict-provenance
            command: scripts/ai/verify_release.sh v20-strict-provenance
          - stage: release-v201-patch-release-gates
            command: scripts/ai/verify_release.sh v20.1-release-gates
          - stage: release-v21-release-gates
            command: scripts/ai/verify_release.sh v21-release-gates
          - stage: release-v21-strict-provenance
            command: scripts/ai/verify_release.sh v21-strict-provenance
          - stage: release-v211-release-gates
            command: scripts/ai/verify_release.sh v21.1-release-gates
          - stage: release-v211-strict-provenance
            command: scripts/ai/verify_release.sh v21.1-strict-provenance
          - stage: release-v22-runtime-boundary-tests
            command: scripts/ai/verify_release.sh v22-runtime-boundary-tests
          - stage: release-v22-release-gates
            command: scripts/ai/verify_release.sh v22-release-gates
          - stage: release-v22-strict-provenance
            command: scripts/ai/verify_release.sh v22-strict-provenance
          - stage: release-surface-current-guard
            command: scripts/ai/verify_release.sh release-surface-current-guard
          - stage: release-publication-guard
            command: scripts/ai/verify_release.sh release-publication-guard
          - stage: release-publish-after-gate
            command: scripts/ai/verify_release.sh release-publish-after-gate
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      NTPRO_RELEASE_SURFACE_ALLOW_MISSING_TAG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      NTPRO_RELEASE_PUBLICATION_ALLOW_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reclaim runner disk
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h

      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          override: true

      - name: Verify release gate stage
        env:
          NTPRO_RELEASE_GATE: "1"
          NTPRO_V02_009_SKIP_BUILD: "0"
        run: ${{ matrix.command }}

  verify-release:
    name: verify-release
    runs-on: ubuntu-latest
    needs:
      - release-stage
    if: always()
    steps:
      - name: Summarize release gate
        run: |
          echo "release-stage result: ${{ needs.release-stage.result }}"
          if [[ "${{ needs.release-stage.result }}" != "success" ]]; then
            exit 1
          fi
          echo "release gate status=ok"
