name: Rust Cutover Release Gate

on:
  push:
    tags:
      - "ntpro-rust-only-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-stage:
    name: verify-release (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: full-fast
            command: scripts/ai/verify_full.sh fast
          - stage: full-clippy
            command: scripts/ai/verify_full.sh clippy
