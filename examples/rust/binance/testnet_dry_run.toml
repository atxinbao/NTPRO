[run]
id = "v06-binance-testnet-dry-run"
mode = "dry-run"

[venue]
name = "BINANCE"
product = "spot"
environment = "testnet"

[credentials]
# v0.8 online probes may read credentials from these env vars only.
# Never put API key or API secret values in this file.
# Public read-only probes do not require credentials. Authenticated read-only
# probes are manual-online-only and only record env var presence, never values.
api_key_env = "BINANCE_TESTNET_API_KEY"
api_secret_env = "BINANCE_TESTNET_API_SECRET"
values_in_file = false
# New split credential contract. These fields take priority over the legacy
# required_for_network field.
required_for_public_read_only_probe = false
required_for_authenticated_read_only_probe = true
# Legacy compatibility field retained for migration-warning evidence only.
required_for_network = true

[connectivity]
# Default workflow runs stay offline. The V070 HTTP public read-only testnet
# probe is fail-closed and additionally requires --allow-testnet-network plus
# NTPRO_ALLOW_TESTNET_NETWORK=1.
mode = "dry-run"
http_base_url = "https://testnet.binance.vision"
ws_base_url = "wss://stream.testnet.binance.vision/ws"
network_attempted = false

[execution]
# v0.7 read-only connectivity proof never submits orders.
order_submission = "disabled"
reconciliation = "artifact-only"
real_orders_submitted = false
