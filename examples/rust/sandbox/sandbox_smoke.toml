[run]
id = "sandbox-smoke"
mode = "sandbox"
environment = "sandbox"

[system]
trader_id = "TRADER-001"
instance_id = "sandbox-smoke-001"
log_level = "info"

[[venues]]
name = "SIM"
adapter = "sandbox"
account_type = "MARGIN"
oms_type = "HEDGING"
starting_balances = ["1000000 USD"]

[[data]]
source = "synthetic-quotes"
instrument_id = "AUD/USD.SIM"
events = 3

[strategy]
strategy_name = "ema"
instrument_id = "AUD/USD.SIM"
bar_type = "AUD/USD.SIM-1-MINUTE-LAST-EXTERNAL"
trade_size = "1000"
max_orders = 2
risk_profile = "sandbox"
fast_period = 10
slow_period = 20
signal_mode = "cross"

[execution]
order_submission = "simulated"
reconciliation = "disabled"

[risk]
mode = "simulated"
max_order_qty = 1000

[portfolio]
mode = "simulated"
starting_balance = "1000000 USD"

[cache]
mode = "in-memory"
warmup_instruments = ["AUD/USD.SIM"]

[shutdown]
mode = "once"
max_runtime_secs = 1
disconnect_timeout_secs = 1

[output]
dir = "runs/sandbox-smoke"
write_summary = true
