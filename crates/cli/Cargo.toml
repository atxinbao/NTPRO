[package]
name = "nautilus-cli"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
defi = ["dep:nautilus-blockchain", "nautilus-model/defi"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-backtest = { workspace = true }
nautilus-binance = { workspace = true }
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-infrastructure = { workspace = true, features = ["postgres"] }
nautilus-live = { workspace = true, features = ["node"] }
nautilus-model = { workspace = true }
nautilus-risk = { workspace = true }
nautilus-sandbox = { workspace = true }
nautilus-trading = { workspace = true, features = ["examples"] }

nautilus-blockchain = { workspace = true, features = [
  "hypersync",
], optional = true }

anyhow = { workspace = true }
aws-lc-rs = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
tower = { workspace = true }

[[bin]]
name = "nautilus"
path = "src/bin/cli.rs"
doc = false
test = false

[[bin]]
name = "ntpro-node"
path = "src/bin/ntpro_node.rs"
doc = false
test = false
