[package]
name = "nautilus-databento"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Databento integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_databento"
crate-type = ["rlib"]

[features]
default = ["live", "high-precision"]
arrow = ["dep:arrow", "nautilus-serialization"]
live = ["nautilus-live", "nautilus-live/node", "dep:nautilus-system", "dotenvy"]
high-precision = [
  "nautilus-model/high-precision",
  "nautilus-serialization?/high-precision",
]
nautilus-system = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["nautilus-system"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true, optional = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }
nautilus-serialization = { workspace = true, features = [
  "arrow",
], optional = true }
nautilus-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
databento = { workspace = true }
fallible-streaming-iterator = { workspace = true }
indexmap = { workspace = true }
itoa = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

arrow = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "databento-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["live"]
doc = false

[[test]]
name = "feed_handler"
path = "tests/feed_handler.rs"
required-features = ["live"]
