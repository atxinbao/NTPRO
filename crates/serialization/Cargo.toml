[package]
name = "nautilus-serialization"
readme = "README.md"
include = [
  "src/**/*",
  "schemas/**/*",
  "tests/**/*",
  "benches/**/*",
  "Cargo.toml",
  "README.md",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Serialization functionality for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_serialization"
crate-type = ["rlib"]

[features]
default = []
arrow = ["dep:arrow", "nautilus-model/arrow"]
display = ["arrow"]
sbe = []
high-precision = ["nautilus-model/high-precision"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-core = { workspace = true }
nautilus-model = { workspace = true, features = ["stubs"] }

anyhow = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ustr = { workspace = true }

arrow = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "serialization_comparison"
path = "benches/serialization_comparison.rs"
harness = false

[[bench]]
name = "sbe_decoding"
path = "benches/sbe_decoding.rs"
harness = false
required-features = ["sbe"]
